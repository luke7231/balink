scalar DateTime
scalar JSON

enum SourceName {
  balletmania
  esangdance
}

enum ScraperRunStatus {
  running
  success
  failed
}

enum SubstitutePostStatus {
  OPEN
  EXPIRED
  DELETED
}

type Query {
  health: Health!
  jobPost(id: ID!): JobPost
  jobPosts(filter: JobPostFilterInput, pagination: PaginationInput): JobPostConnection!
  jobRegions: [JobRegionGroup!]!
  substitutePost(id: ID!): SubstitutePost
  substitutePosts(filter: SubstitutePostFilterInput, pagination: PaginationInput): SubstitutePostConnection!
  scraperRuns(limit: Int = 20): [ScraperRun!]!
}

type Health {
  ok: Boolean!
  service: String!
  jobCount: Int!
  substituteCount: Int!
  latestScraperRun: ScraperRun
}

type JobPostSummary {
  id: ID!
  title: String!
  sourcePrimary: SourceName!
  jobType: String
  postedAt: DateTime
  locationText: String
  sido: String
  sigungu: String
  dongOrStation: String
  audienceTypes: [String!]!
  subjectTypes: [String!]!
  days: [String!]!
  timeSlots: [String!]!
  times: [String!]!
  payText: String
  payMinManwon: Float
  payMaxManwon: Float
  payNegotiable: Boolean!
  representativePayText: String
  createdAt: DateTime!
  updatedAt: DateTime!
}

type DisplaySection {
  title: String!
  content: String!
}

type RepresentativePay {
  unit: String!
  displayText: String!
  minManwon: Float
  maxManwon: Float
  evidence: String
  confidence: String!
  hasConflict: Boolean!
  alternateEvidence: String
}

type AcademyGalleryImage {
  type: String!
  order: Int!
  url: String!
  sourceUrl: String
}

type JobPost {
  id: ID!
  title: String!
  description: String
  sourcePrimary: SourceName!
  status: String
  jobType: String
  postedAt: DateTime
  isBallet: Boolean!
  balletConfidence: String
  locationText: String
  sido: String
  sigungu: String
  dongOrStation: String
  audienceTypes: [String!]!
  subjectTypes: [String!]!
  days: [String!]!
  timeSlots: [String!]!
  times: [String!]!
  classCount: Int
  durationMinutes: Int
  payType: String
  payText: String
  payMinManwon: Float
  payMaxManwon: Float
  payNegotiable: Boolean!
  representativePayText: String
  displaySections: [DisplaySection!]!
  representativePay: RepresentativePay
  locationSource: String
  academyLogoUrl: String
  academyGallery: [AcademyGalleryImage!]!
  contactMethods: [String!]!
  contactEmails: [String!]!
  contactPhones: [String!]!
  requirements: JSON
  confidence: JSON
  sources: [JobPostSourceLink!]!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type JobPostSourceLink {
  id: ID!
  source: SourceName!
  sourceUrl: String!
  confidence: String
  sourcePost: SourcePostSummary!
}

type SourcePostSummary {
  id: ID!
  sourcePostId: String!
  title: String!
  sourceUrl: String!
  postedAt: DateTime
}

type JobPostConnection {
  items: [JobPostSummary!]!
  pageInfo: PageInfo!
}

type PageInfo {
  page: Int!
  limit: Int!
  total: Int!
  totalPages: Int!
}

type JobRegionGroup {
  sido: String!
  districts: [JobRegionCount!]!
}

type JobRegionCount {
  sigungu: String!
  count: Int!
}

type SubstituteTimeSlot {
  start: String
  end: String
  raw: String
}

type SubstitutePostSummary {
  id: ID!
  source: SourceName!
  sourceUrl: String!
  title: String!
  author: String
  postedAt: DateTime
  lessonDates: [String!]!
  timeSlots: [SubstituteTimeSlot!]!
  audienceTypes: [String!]!
  subjectTypes: [String!]!
  locationText: String
  sido: String
  sigungu: String
  dongOrStation: String
  payText: String
  urgency: String
  status: SubstitutePostStatus!
  expiresAt: DateTime
  recommendCount: Int!
  viewCount: Int!
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SubstitutePost {
  id: ID!
  source: SourceName!
  sourceUrl: String!
  title: String!
  author: String
  postedAt: DateTime
  body: String
  lessonDates: [String!]!
  timeSlots: [SubstituteTimeSlot!]!
  audienceTypes: [String!]!
  subjectTypes: [String!]!
  locationText: String
  sido: String
  sigungu: String
  dongOrStation: String
  payText: String
  urgency: String
  status: SubstitutePostStatus!
  expiresAt: DateTime
  recommendCount: Int!
  viewCount: Int!
  contactMethods: [String!]!
  contactEmails: [String!]!
  contactPhones: [String!]!
  classification: JSON
  createdAt: DateTime!
  updatedAt: DateTime!
}

type SubstitutePostConnection {
  items: [SubstitutePostSummary!]!
  pageInfo: PageInfo!
}

input SubstitutePostFilterInput {
  status: SubstitutePostStatus
  sido: String
  sigungu: String
  source: SourceName
}

type ScraperRun {
  id: ID!
  source: SourceName
  targetDate: String!
  llmMode: String!
  status: ScraperRunStatus!
  startedAt: DateTime!
  finishedAt: DateTime
  collected: Int!
  classified: Int!
  imported: Int!
  errorMessage: String
}

input JobPostFilterInput {
  sido: String
  sigungu: String
  jobType: String
  source: SourceName
}

input PaginationInput {
  page: Int
  limit: Int
}
