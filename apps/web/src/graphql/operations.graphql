query Health {
  health {
    ok
    service
    jobCount
    substituteCount
  }
}

query JobPosts($filter: JobPostFilterInput, $pagination: PaginationInput, $sort: JobPostSort) {
  jobPosts(filter: $filter, pagination: $pagination, sort: $sort) {
    items {
      id
      title
      sourcePrimary
      jobType
      postedAt
      locationText
      sido
      sigungu
      dongOrStation
      audienceTypes
      subjectTypes
      days
      dayGroups
      timeSlots
      times
      payText
      payMinManwon
      payMaxManwon
      payNegotiable
      representativePayText
      academyThumbnailUrl
      academyThumbnailType
      createdAt
      updatedAt
    }
    pageInfo {
      page
      limit
      total
      totalPages
    }
  }
}

query JobRegions {
  jobRegions {
    sido
    districts {
      sigungu
      count
    }
  }
}

query JobPost($id: ID!) {
  jobPost(id: $id) {
    id
    title
    description
    sourcePrimary
    status
    jobType
    postedAt
    isBallet
    balletConfidence
    locationText
    sido
    sigungu
    dongOrStation
    audienceTypes
    subjectTypes
    days
    dayGroups
    timeSlots
    times
    classCount
    durationMinutes
    payType
    payText
    payMinManwon
    payMaxManwon
    payNegotiable
    representativePayText
    displaySections {
      title
      content
    }
    representativePay {
      unit
      displayText
      minManwon
      maxManwon
      evidence
      confidence
      hasConflict
      alternateEvidence
    }
    locationSource
    academyLogoUrl
    academyGallery {
      type
      order
      url
      sourceUrl
    }
    organization {
      id
      name
      type
      sido
      sigungu
      dongOrStation
      logoUrl
      externalProfileUrl
      createdAt
      updatedAt
    }
    contactMethods
    contactEmails
    contactPhones
    requirements
    confidence
    sources {
      id
      source
      sourceUrl
      confidence
      sourcePost {
        id
        sourcePostId
        title
        sourceUrl
        postedAt
      }
    }
    createdAt
    updatedAt
  }
}

query Organization($id: ID!) {
  organization(id: $id) {
    id
    name
    type
    sido
    sigungu
    dongOrStation
    logoUrl
    externalProfileUrl
    phones
    emails
    gallery {
      type
      order
      url
      sourceUrl
    }
    jobPostCount
    jobPosts {
      id
      title
      sourcePrimary
      jobType
      postedAt
      locationText
      sido
      sigungu
      dongOrStation
      audienceTypes
      subjectTypes
      days
      dayGroups
      timeSlots
      times
      payText
      payMinManwon
      payMaxManwon
      payNegotiable
      representativePayText
      academyThumbnailUrl
      academyThumbnailType
      createdAt
      updatedAt
    }
    createdAt
    updatedAt
  }
}
