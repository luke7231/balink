query SubstitutePosts($filter: SubstitutePostFilterInput, $pagination: PaginationInput) {
  substitutePosts(filter: $filter, pagination: $pagination) {
    items {
      id
      title
      summary
      author
      postedAt
      scheduleKind
      sessions {
        date
        day
        startTime
        endTime
        audienceTypes
        subjectTypes
        origin
      }
      recurrence {
        startDate
        endDate
        daysOfWeek
        startTime
        endTime
        evidence
      }
      lessonDates
      timeSlots {
        start
        end
        raw
      }
      locationText
      sido
      sigungu
      dongOrStation
      payText
      representativePayText
      academyName
      urgency
      status
      nextLessonAt
      sourceUrl
      createdAt
      updatedAt
    }
    pageInfo {
      page
      limit
      total
      totalPages
    }
  }
}

query SubstitutePost($id: ID!) {
  substitutePost(id: $id) {
    id
    title
    summary
    author
    postedAt
    body
    scheduleKind
    sessions {
      date
      day
      startTime
      endTime
      durationMinutes
      audienceTypes
      subjectTypes
      pay {
        unit
        minManwon
        maxManwon
        evidence
      }
      evidence
      origin
    }
    recurrence {
      startDate
      endDate
      endDateInferred
      daysOfWeek
      startTime
      endTime
      durationMinutes
      audienceTypes
      subjectTypes
      evidence
    }
    lessonDates
    timeSlots {
      start
      end
      raw
    }
    locationText
    sido
    sigungu
    dongOrStation
    payText
    representativePay {
      unit
      displayText
      minManwon
      maxManwon
      evidence
      confidence
    }
    representativePayText
    academyName
    requirements
    applicationInstructions
    notes
    urgency
    status
    nextLessonAt
    expiresAt
    recommendCount
    viewCount
    contactMethods
    contactEmails
    contactPhones
    sourceUrl
    classification
    createdAt
    updatedAt
  }
}
